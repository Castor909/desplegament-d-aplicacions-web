# sitio1 - conexion HTTPS (basado en la plantilla default-ssl / httpd-ssl.conf)
Listen 443

# Cache de sesiones SSL (requiere socache_shmcb_module)
SSLSessionCache        "shmcb:/run/httpd/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost *:443>
    ServerName www.sitio1.com
    ServerAlias sitio1.com
    DocumentRoot "/var/www/sitio1"

    # --- Configuracion SSL: clave y certificado autofirmados (Paso 3) ---
    SSLEngine on
    SSLCertificateFile    "/etc/httpd/conf/extra/sitio1.crt"
    SSLCertificateKeyFile "/etc/httpd/conf/extra/sitio1.key"

    SSLProtocol all -SSLv3
    SSLCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES

    <Directory "/var/www/sitio1">
        AllowOverride All
        Require all granted
    </Directory>

    # --- Directory heredado de la Practica 4: autenticacion por grupos ---
    <Directory "/var/www/sitio1/ficheros">
        Options Indexes FollowSymLinks
        DirectoryIndex index.html
        AuthType Basic
        AuthName "Zona protegida"
        AuthUserFile /etc/httpd/claves.txt
        AuthGroupFile /etc/httpd/grupos.txt
        Require group grupoA grupoC
        AuthzSendForbiddenOnFailure On
    </Directory>

    # --- AWStats (Practica 6): CGI de estadisticas + iconos ---
    ScriptAlias /awstats/ "/usr/share/webapps/awstats/cgi-bin/"
    Alias /awstatsicons "/usr/share/webapps/awstats/icon/"

    <Directory "/usr/share/webapps/awstats/">
        Options +ExecCGI
        Require all granted
    </Directory>

    # --- PHP via php-fpm (FastCGI), equivalente a mod_php (Practica 6) ---
    DirectoryIndex index.php index.html
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # --- phpMyAdmin (Practica 6): Alias /phpmyadmin ---
    Alias /phpmyadmin "/usr/share/webapps/phpMyAdmin"
    <Directory "/usr/share/webapps/phpMyAdmin">
        DirectoryIndex index.php
        Require all granted
    </Directory>

    ErrorLog "/var/log/httpd/sitio1-ssl-error_log"
    CustomLog "/var/log/httpd/sitio1-ssl-access_log" combined
</VirtualHost>
