services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --general-log=1 --general-log-file=/var/lib/mysql/general.log
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stepan_db
      MYSQL_USER: stepan
      MYSQL_PASSWORD: stepanpass
    volumes:
      - ./datadir:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpass
    depends_on:
      - db
